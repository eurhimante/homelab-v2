name: homelab

networks:
  homelab:
    driver: bridge

services:

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped

    network_mode: host

    environment:
      TZ: ${TZ}

    volumes:
      - ./data/npm/data:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt

    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:81/health"]
      interval: 30s
      timeout: 10s
      retries: 10

  jellyfin-invites:
    build:
      context: ./services/jellyfin-invites
    container_name: jellyfin-invites
    restart: unless-stopped

    network_mode: host

    environment:
      APP_DATA_DIR: /app/data
      INVITE_ADMIN_USERNAME: ${INVITE_ADMIN_USERNAME}
      INVITE_ADMIN_PASSWORD: ${INVITE_ADMIN_PASSWORD}
      INVITE_ENCRYPTION_KEY: ${INVITE_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      JELLYFIN_URL: http://127.0.0.1:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}

    volumes:
      - ./data/jellyfin-invites:/app/data

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped

    environment:
      FB_ROOT: /srv
      FB_DATABASE: /database/filebrowser.db

    volumes:
      - ./data/filebrowser/database:/database
      - ./data/filebrowser/config:/config
      - /mnt/rasplex:/srv:rw

    networks:
      - homelab

    ports:
      - "8081:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 10

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    container_name: mealie
    restart: unless-stopped

    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
      BASE_URL: https://mealie.solainecreation.fr

    volumes:
      - ./data/mealie:/app/data

    networks:
      - homelab

    ports:
      - "127.0.0.1:9925:9000"

    deploy:
      resources:
        limits:
          memory: 1G

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000"]
      interval: 30s
      timeout: 10s
      retries: 10

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped

    group_add:
      - "1001"

    environment:
      PUID: 1000
      PGID: 1000
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}

    volumes:
      - ./data/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "127.0.0.1:3080:3000"

    networks:
      - homelab

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 10

  hub3d-backend:
    build:
      context: ./services/hub3d/3DPlatform/print_engine

    container_name: hub3d-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      PRINTER_IP: ${PRINTER_IP:-192.168.1.193}
      MOONRAKER_URL: ${MOONRAKER_URL:-http://192.168.1.193:7125}
      PRINTER_INTERFACE_URL: ${PRINTER_INTERFACE_URL:-http://192.168.1.193/#/home}

    volumes:
      - ./services/hub3d/3DPlatform/print_engine/templates_3mf:/app/templates_3mf
      - /mnt/rasplex:/mnt/rasplex

    networks:
      - homelab

    expose:
      - "8000"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 10


  hub3d-frontend:
    build:
      context: ./services/hub3d/3DPlatform/print_engine_front

    container_name: hub3d-frontend
    restart: unless-stopped

    depends_on:
      hub3d-backend:
        condition: service_started

    networks:
      - homelab

    ports:
      - "127.0.0.1:8082:80"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 10
