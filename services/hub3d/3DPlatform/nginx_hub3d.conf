# Exemple de configuration Nginx pour Hub 3D
# À copier dans ton nginx.conf ou dans conf.d/hub3d.conf
# Remplace hub3d.ton-domaine.com par ton vrai sous-domaine.

server {
    listen 80;
    server_name hub3d.ton-domaine.com;

    # Frontend React build
    root C:/3DPlatform/print_engine_front/dist;
    index index.html;

    # STL / 3MF / G-code peuvent être gros
    client_max_body_size 500M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API FastAPI derrière /api
    # IMPORTANT : le slash final dans proxy_pass enlève le préfixe /api.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }
}
